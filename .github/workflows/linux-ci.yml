name: linux-ci

on:
  - push
  - pull_request

jobs:
  build-ubuntu:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu
        compiler:
          - clang
          - gcc
        strictness:
          - "normal"
          - "strict"

    steps:

      - name: Configure environment
        shell: bash
        run: |
          echo "Nothing to do for Linux"

      - name: Install packages
        run: |
          sudo apt-get install -qq \
            libncurses-dev	\
            libslang2-dev	\
            libx11-dev	\
            libgpm-dev	\
            liballegro4.2-dev	\
            libcairo2-dev	\
            libcups2-dev	\
            libcurl4-openssl-dev	\
            firebird-dev	\
            libgd-dev	\
            libgs-dev	\
            libmagic-dev	\
            libmysqlclient-dev	\
            unixodbc-dev	\
            libpq-dev	\
            qtbase5-dev

          # Dependencies for disabled contribs:
          #  libfreeimage-dev	\

      - name: Configure build shell
        run: |
          set -ex
          rm ~/.bashrc
          HB_USER_CFLAGS=""
          HB_USER_LDFLAGS=""
          case ${{matrix.strictness}} in
            normal) ;;
            strict) case ${{matrix.compiler}} in
                      (*)   HB_USER_CFLAGS="$HB_USER_CFLAGS -Werror" ;;
                    esac ;;
          esac
          tee -a ~/.bashrc <<EOENV
          # These contribs do not build on any platform
          export HB_BUILD_CONTRIBS="no hbfimage"  # incompatible with freeimage 3.18+

          export HB_BUILD_VERBOSE="yes"
          export HB_USER_CFLAGS="$HB_USER_CFLAGS"
          export HB_USER_LDFLAGS="$HB_USER_LDFLAGS"
          export HB_CCACHE=ccache
          EOENV


      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.client_payload.branch }}

      - run: pwd
      - run: ls

      - name: Prepare ccache using action
        uses: hendrikmuhs/ccache-action@v1.2.10
        with:
          key: ${{ matrix.os }}-${{ matrix.compiler }}-${{ matrix.strictness }}-ci
          max-size: "32M"

      - name: Compile Harbour
        run: |
          set -ex
          source ~/.bashrc
          make -j$(nproc) \
            HB_COMPILER=${{matrix.compiler}}

      - name: Run tests
        run: |
          set -ex
          bin/linux/${{matrix.compiler}}/hbtest
