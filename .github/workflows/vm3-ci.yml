name: vm3-ci

on:
  - push
  - pull_request

jobs:
  vm3-ci:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        os:
          - name: dosemu
        compiler:
          - djgpp
          - watcom
        strictness:
          - "normal"
          - "strict"

    steps:

      - name: Configure environment
        run: |
          echo "Nothing to do for MS-DOS"

      - name: Install packages
        run: |
          set -ex
          echo "The actual install takes place in the VM in the build step"
          sudo add-apt-repository -y ppa:dosemu2/ppa
          sudo apt -y update
          sudo apt -y install dosemu2
          cat /etc/dosemu/dosemu.conf

          mkdir -p ~/.dosemu

          tee ~/.dosemu/dosemurc <<'EOF'
          $_cpu_vm = "emulated"
          $_cpu_vm_dpmi = "emulated"
          $_speaker = "native"
          $_sound = "off"
          EOF

          case ${{ matrix.compiler }} in
            djgpp)
              mkdir -p ~/.dosemu/drive_c/djgpp
              cd ~/.dosemu/drive_c/djgpp
              root_url="ftp://ftp.fu-berlin.de/pc/languages/djgpp/current/"
              curl -LO "$root_url/v2gnu/mak44b.zip"
              curl -LO "$root_url/v2gnu/bnu2351b.zip"
              curl -LO "$root_url/v2gnu/gcc930b.zip"
              curl -LO "$root_url/v2/djdev205.zip"
              unzip mak44b.zip
              unzip bnu2351b.zip
              unzip gcc930b.zip
              unzip djdev205.zip
              ;;
            watcom)
              mkdir -p ~/.dosemu/drive_c/watcom
              cd ~/.dosemu/drive_c/watcom
              curl -Lo install.exe http://openwatcom.org/ftp/install/open-watcom-c-dos-1.9.exe
              ;;
          esac

      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.client_payload.branch }}

      - run: pwd
      - run: ls

      - name: Generate build script
        run: |
            case ${{ matrix.compiler }} in
              watcom)
                tee runbuild.bat <<'EOF'
            c:
            cd \watcom
            install.exe
            EOF
                ;;
            esac
            tee -a runbuild.bat <<'EOF'
            cd \src
            echo ::group::Build Harbour
            set PATH=c:\djgpp\bin;%PATH%
            set DJGPP=c:\djgpp\djgpp.env
            set WATCOM=c:\watcom
            set PATH=%WATCOM%\BINW;%PATH%
            dos-make.exe HB_BUILD_CONTRIBS=no HB_COMPILER=${{matrix.compiler}}

            echo ::group::Build contribs
            dos-make.exe -C contrib HB_COMPILER=${{matrix.compiler}}

            echo ::group::Run tests
            bin\dos\${{matrix.compiler}}\hbtest
            EOF

      - name: Build Harbour and contribs
        run: |
          rsync -a . ~/.dosemu/drive_c/src
          dosemu -dumb -exec 'c:\src\runbuild.bat'
