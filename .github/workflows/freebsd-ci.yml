name: freebsd-ci

on:
  - push
  - pull_request

jobs:
  freebsd-ci:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        compiler:
          - clang
          - gcc
        strictness:
          - "normal"
          - "strict"

    steps:

      - name: Configure environment
        shell: bash
        run: |
          echo "Nothing to do for FreeBSD"

      - name: Install packages
        run: |
          echo "We need to install once, in VM"

      - name: Configure build shell
        run: |
          set -ex
          rm ~/.bashrc
          HB_USER_CFLAGS="-arch arm64 -arch x86_64"
          HB_USER_LDFLAGS="-arch arm64 -arch x86_64"
          case ${{matrix.strictness}} in
            normal) ;;
            strict) case ${{matrix.compiler}} in
                      (*)   HB_USER_CFLAGS="$HB_USER_CFLAGS -Werror" ;;
                    esac ;;
          esac
          tee -a ~/.bashrc <<EOENV
          # These contribs do not build on any platform
          export HB_BUILD_CONTRIBS="no hbfimage"  # incompatible with freeimage 3.18+

          export HB_BUILD_VERBOSE="yes"
          export HB_USER_CFLAGS="$HB_USER_CFLAGS"
          export HB_USER_LDFLAGS="$HB_USER_LDFLAGS"
          export HB_CCACHE=ccache
          EOENV


      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.client_payload.branch }}

      - run: pwd
      - run: ls

      - name: Prepare ccache using action
        uses: hendrikmuhs/ccache-action@v1.2.10
        with:
          key: freebsd-${{ matrix.compiler }}-${{ matrix.strictness }}-ci
          max-size: "32M"

      - name: Build Harbour and contribs
        uses: cross-platform-actions/action@v0.15.0
        with:
          operating_system: freebsd
          architecture: x86_64
          version: "13.2"
          shell: bash
          memory: 5G
          cpu_count: 4
          sync_files: "true"
          run: |
            set -ex
            sudo pkg install -y \
              bison ccache gmake \
              libslang2 \
              cairo \
              libgd \
              mariadb-connector-c \
              postgresql16-client \
              qt5

            # Dependencies for disabled contribs:
            #  freeimage \

            set -ex
            source ~/.bashrc
            make -j$(sysctl -n hw.logicalcpu) \
              HB_BUILD_CONTRIBS=no \
              HB_COMPILER=${{matrix.compiler}}

            set -ex
            source ~/.bashrc
            make -j$(sysctl -n hw.logicalcpu) \
              -C contrib \
              HB_COMPILER=${{matrix.compiler}}

            set -ex
            bin/freebsd/${{matrix.compiler}}/hbtest
